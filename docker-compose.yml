# ALERTE 3D : Kafka + Ollama + simulation (agents LLM et à règles) + passerelle WebSocket pour Godot.
# Godot tourne sur votre machine (il a besoin de la carte graphique et d'un écran) et se connecte à ws://127.0.0.1:8765.
services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:      # crée les 4 topics (événements, commandes de Godot, indicateurs, lettres mortes)
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c", "for t in alerte.events alerte.commands alerte.indicators alerte.dlq; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t; done"]

  ollama:
    image: ollama/ollama:latest
    volumes: [ "ollama:/root/.ollama" ]
    environment: { OLLAMA_NUM_PARALLEL: "2", OLLAMA_MAX_LOADED_MODELS: "3", OLLAMA_KEEP_ALIVE: "30m" }
    # pas de port publié sur le PC : la simulation parle à ollama:11434 à l'intérieur de Docker.
    # (évite le conflit avec une application Ollama déjà installée sur Windows, qui occupe déjà le port 11434)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12
    # Carte NVIDIA (optionnel, beaucoup plus rapide) : lancer.bat gpu (fichier docker-compose.gpu.yml), ou décommentez la ligne suivante
    # deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: all, capabilities: [gpu] } ] } } }

  ollama-pull:     # télécharge les modèles au premier lancement (~6 Go), puis ne refait rien
    image: ollama/ollama:latest
    depends_on: { ollama: { condition: service_healthy } }
    environment: { OLLAMA_HOST: "ollama:11434" }
    env_file: [ .env.exemple, { path: .env, required: false } ]   # .env (non versionné) remplace les valeurs du modèle
    entrypoint: ["/bin/sh", "-c", "ollama pull $${LLM_BIG%% *} && ollama pull $${LLM_SMALL%% *} && ollama pull $${EMBED_MODEL%% *}"]

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    environment: { KAFKA: "kafka:9092" }
    ports: [ "8765:8765" ]
    depends_on: { kafka-init: { condition: service_completed_successfully } }

  sim:
    build: { context: ., dockerfile: sim/Dockerfile }
    env_file: [ .env.exemple, { path: .env, required: false } ]   # .env (non versionné) remplace les valeurs du modèle
    environment: { KAFKA: "kafka:9092", OLLAMA_URL: "http://ollama:11434", RUNS_DIR: /data/runs }
    volumes: [ "./data:/data" ]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      ollama-pull: { condition: service_completed_successfully }
      gateway: { condition: service_started }

  replay:          # rejeu sans aucun appel LLM :  docker compose --profile replay up replay
    build: { context: ., dockerfile: sim/Dockerfile }
    profiles: [ "replay" ]
    env_file: [ .env.exemple, { path: .env, required: false } ]   # .env (non versionné) remplace les valeurs du modèle
    environment: { KAFKA: "kafka:9092", RUNS_DIR: /data/runs }
    volumes: [ "./data:/data" ]
    depends_on: { kafka-init: { condition: service_completed_successfully }, gateway: { condition: service_started } }

volumes: { ollama: {} }
