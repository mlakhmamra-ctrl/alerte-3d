# Garde-fou contre la dette technique : à chaque push et pull request, analyse statique et tests
# (unitaires, non-régression bit à bit des runs à règles, chaîne LLM avec le faux Ollama, jobs Spark).
name: qualite
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4        # Spark (tests/test_spark.py) tourne sur la JVM
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check sim gateway tools spark tests
      - run: python -m pytest
